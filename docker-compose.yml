# code-crafter long-lived services (Phase 0/1b). Ticket containers are started on demand by the control plane.
#   docker compose build agent      # build the per-ticket agent image
#   docker compose up -d            # n8n, redis, smee, neo4j, control-plane
#   scripts/n8n-import.sh           # load + publish the workflows from n8n/workflows
name: code-crafter

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    restart: unless-stopped

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.41.3
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      TZ: Asia/Kolkata
      GENERIC_TIMEZONE: Asia/Kolkata
      CONTROL_PLANE_URL: http://control-plane:3000
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      # ops → Jira workflow calls Jira and Slack directly (read via $env, never stored in workflow JSON)
      JIRA_BASE_URL: ${JIRA_BASE_URL}
      JIRA_EMAIL: ${JIRA_EMAIL}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    restart: unless-stopped

  # GitHub webhooks → smee.io → here → n8n (docs/03-event-bus-n8n.md)
  smee:
    image: node:24-alpine
    command: ["sh", "-c", "npx --yes smee-client@2 --url \"$$SMEE_URL\" --target http://n8n:5678/webhook/github"]
    environment:
      SMEE_URL: ${SMEE_URL}
    depends_on: [n8n]
    restart: unless-stopped

  # Architecture graph (docs/10-context-graph.md, D34). Browser UI: http://localhost:7474 (user neo4j).
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]' # the MCP server's get_neo4j_schema tool needs APOC
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

  control-plane:
    build: ./control-plane
    env_file: .env
    environment:
      TZ: Asia/Kolkata
      REDIS_URL: redis://redis:6379
      N8N_WEBHOOK_BASE: http://n8n:5678/webhook
      SERVICES_FILE: /config/services.yaml
      AGENT_NETWORK: codecrafter
      CONTROL_PLANE_URL: http://control-plane:3000 # forwarded to agent containers
      NEO4J_URL: bolt://neo4j:7687
      OLLAMA_URL: http://host.docker.internal:11434 # Ollama runs natively on the Mac (D35)
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config:/config:ro
    depends_on: [redis, n8n, neo4j]
    restart: unless-stopped

  # Not a running service: `docker compose build agent` builds the image the control plane spawns.
  agent:
    build: ./agent
    image: code-crafter-agent
    profiles: ["build-only"]

volumes:
  redis_data:
  neo4j_data:
  n8n_data:
    external: true # the volume from the original standalone n8n container (D22)

networks:
  default:
    name: codecrafter
